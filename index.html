<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>現場管理</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="現場管理">
<meta name="theme-color" content="#EEF2F6">
<meta name="referrer" content="no-referrer">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<style>body{margin:0;background:#EEF2F6;font-family:system-ui,sans-serif;color:#556}#l{padding:40vh 0 0;text-align:center}</style>
</head>
<body>
<div id="l">読み込み中…</div>
<script>
(function () {
  var EXEC = "https://script.google.com/macros/s/AKfycbxwkcXpKVnnYRiQjNHNK8OiXBcm9N00EpUlX4wFwLa_8bhdpH9n1ybd1EWy6zzs5DgE/exec";
  var HK = 'genba_html_v1';
  // 画面の元はグーグル側にある。一度読んだら覚えておき、次からはすぐ出して、裏で新しいものに入れ替えておく
  function build(raw) {
    var keyCode = "var KEY = (function () {" +
      "function g(t) { var m = /[#?&]k=([^&]+)/.exec(t); return m ? decodeURIComponent(m[1]) : ''; }" +
      "var k = g(location.hash) || g(location.search);" +
      "try { if (k) localStorage.setItem('genba_k', k); else k = localStorage.getItem('genba_k') || ''; } catch (e) {}" +
      "if (k && (location.hash.indexOf('k=') < 0 || location.search)) { try { history.replaceState(null, '', location.pathname + '#k=' + encodeURIComponent(k)); } catch (e) {} }" +
      "return String(k).replace(/[^A-Za-z0-9]/g, ''); })();";
    var head = '<head>\n<meta charset="utf-8"><title>現場管理</title>' +
      '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">' +
      '<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="現場管理">' +
      '<meta name="theme-color" content="#EEF2F6"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.json">' +
      '<script>window.GENBA_EXEC = "' + EXEC + '";<\/script>';
    return raw.replace(/var KEY = <\?!=[^\n]*\?>;/, function () { return keyCode; }).replace('<head>', function () { return head; });
  }
  function show(raw) { var h = build(raw); document.open(); document.write(h); document.close(); }
  function getRaw() { return fetch(EXEC + '?raw=index', { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); }).then(function (t) { if (t.indexOf('var KEY') < 0) throw new Error('bad'); return t; }); }
  var cached = null;
  try { cached = localStorage.getItem(HK); } catch (e) {}
  if (cached) {
    show(cached);
    getRaw().then(function (t) { if (t !== cached) { try { localStorage.setItem(HK, t); } catch (e) {} } }).catch(function () {});
  } else {
    getRaw().then(function (t) { try { localStorage.setItem(HK, t); } catch (e) {} show(t); })
      .catch(function () { document.getElementById('l').textContent = 'つながりませんでした。電波のよいところで開き直してください。'; });
  }
})();
</script>
</body>
</html>
